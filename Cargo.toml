[package]
name = "qsol-chatgpt"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
description = "Clean-room Linux-native OpenAI capability broker and human authority console"
repository = "https://github.com/QSOLKCB/ChatGPT"
publish = false

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["screenshot", "tokio"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.51", default-features = false, features = ["rt-multi-thread"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
zeroize = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

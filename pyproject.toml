[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsol-chatgpt"
version = "0.0.1"
description = "Clean-room Linux agent workstation authority core"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "QSOLKCB"}]
dependencies = []

[project.scripts]
qsol-chatgpt = "qsol_chatgpt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
